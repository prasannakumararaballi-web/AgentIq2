[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentiq-v2"
version = "0.1.0"
description = "AgentIQ v2 - Data-quality and AI-assisted data-cleaning platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "starlette>=0.46.0,<1.0.0",
    "pydantic[email]>=2.8.0",
    "pydantic-settings>=2.4.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.1",
    "email-validator>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
engine = [
    "duckdb>=1.0.0",
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
]
worker = [
    "procrastinate[psycopg]>=2.4.0",
]
db = [
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
]

[tool.setuptools.packages.find]
where = [".", "packages"]
include = ["apps*", "agentiq_core*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
pythonpath = [
    ".",
    "packages",
    "apps"
]

[tool.ruff]
line-length = 100
target-version = "py312"
