services:
  - type: web
    name: agentiq-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "https://*,http://localhost:3000"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///storage/agentiq.db
      - key: DIRECT_DATABASE_URL
        value: sqlite:///storage/agentiq.db
      - key: SUPABASE_JWT_SECRET
        generateValue: true
      - key: STORAGE_BACKEND
        value: local
      - key: LOCAL_STORAGE_PATH
        value: storage
